name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t library-app .

      - name: Save image
        run: docker save library-app | gzip > app.tar.gz

      - name: Copy image to EC2
        run: |
          echo "${{ secrets.EC2_KEY }}" | sed 's/\\n/\n/g' > key.pem
          chmod 400 key.pem
          scp -i key.pem -o StrictHostKeyChecking=no app.tar.gz ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/

      - name: Deploy on EC2
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} "
            docker stop library-app || true
            docker rm library-app || true
            docker load < app.tar.gz
            docker run -d -p 8080:8080 \
            --restart unless-stopped \
            --name library-app \
            library-app
          "