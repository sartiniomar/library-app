name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 688674376208.dkr.ecr.us-east-1.amazonaws.com/library-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::688674376208:role/github-actions-ecs-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug files (opcional)
        run: ls -R

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: library-app
          image: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          service: library-service
          cluster: library-cluster
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          wait-for-service-stability: true